<nav x-data="menu" class="container mx-auto max-w-5xl px-4 font-mono">
  <div x-data="search">
    <div class="flex items-center justify-between h-16">
      <!-- Logo and dark mode -->
      <div x-data="theme" class="flex items-center shrink-0">
        <a href="/" class="flex items-center space-x-2">
          <span class="text-lg md:text-xl font-bold text-text">{{ config.title | title }}</span>
        </a>
        <button
          @click="toggle()"
          type="button"
          class="ml-4 rounded-lg flex items-center"
          :aria-label="current === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <i
            :class="current === 'dark' ? 'ti-sun hover:text-yellow' : 'ti-moon hover:text-blue'"
            class="ti text-xl md:text-2xl text-grey transition-colors duration-200 ease-in-out"
          ></i>
        </button>
      </div>

      <!-- Search Desktop -->
      <div class="relative hidden md:block mx-4 flex-1 max-w-xs">
        <input
          type="search"
          placeholder="Search docs..."
          x-model="query"
          @input.debounce.300ms="search"
          @focus="open = true"
          @click.outside="open = false"
          class="w-full px-3 py-1.5 text-sm rounded-md border border-base-alt bg-base-alt text-text placeholder-dark-grey focus:outline-none focus:ring-1 focus:ring-blue"
        />
        <div
          x-show="open && results.length"
          class="absolute top-full left-0 right-0 mt-1 bg-surface border border-base-alt rounded-md shadow-lg z-50 max-h-80 overflow-y-auto"
        >
          <template x-for="r in results" :key="r.item.permalink">
            <a
              :href="r.item.permalink"
              class="block px-3 py-2 text-sm hover:bg-base-alt border-b border-base-alt last:border-0"
            >
              <div x-text="r.item.title" class="font-medium text-text"></div>
              <div x-text="r.item.description" class="text-xs text-grey truncate"></div>
            </a>
          </template>
        </div>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex md:items-center md:space-x-8">
        {% for name, link in config.extra.nav %}
        <a
          :class="{ 'text-blue!': currentPage.startsWith('{{ link }}') }"
          class="text-text-alt hover:text-blue px-3 py-2 rounded-md text-sm font-medium"
          href="{{ link }}"
        >{{ name | title }}</a>
        {% endfor %}
      </div>

      <!-- Mobile Controls -->
      <div class="flex items-center space-x-1 md:hidden">
        <button @click="showMobileSearch = true" type="button" class="p-2 rounded-md text-dark-grey hover:text-text-alt">
          <span class="sr-only">Search</span>
          <i class="ti ti-search text-xl"></i>
        </button>
        <button @click="toggleMobile" type="button" class="p-2 rounded-md text-dark-grey hover:text-text-alt" aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          <svg x-show="!openMobile" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg x-show="openMobile" class="h-5 w-5 text-red" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div
      x-show="openMobile"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      @click.outside="openMobile = false"
      class="md:hidden"
      id="mobile-menu"
    >
      <div class="flex flex-row items-center justify-between pt-2 pb-4">
        {% for name, link in config.extra.nav %}
        <a
          :class="{ 'text-blue!': currentPage.startsWith('{{ link }}') }"
          class="text-text-alt hover:text-blue px-3 py-2 rounded-md text-sm font-medium"
          href="{{ link }}"
        >{{ name | title }}</a>
        {% endfor %}
      </div>
    </div>

    <!-- Mobile Search Overlay -->
    <div
      x-show="showMobileSearch"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-[-10px]"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 translate-y-[-10px]"
      class="md:hidden fixed inset-0 z-50 bg-base"
    >
      <div class="flex items-center p-4 border-b border-base-alt">
        <input
          type="search"
          placeholder="Search docs..."
          x-model="query"
          @input.debounce.300ms="search"
          class="flex-1 px-3 py-2 text-sm rounded-md border border-base-alt bg-surface text-text placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-blue"
          autofocus
        >
        <button
          @click="showMobileSearch = false; query = ''; results = []"
          class="ml-2 shrink-0 text-sm font-medium text-blue hover:text-blue"
        >Cancel</button>
      </div>
      <div x-show="results.length" class="overflow-y-auto max-h-[calc(100vh-80px)]">
        <template x-for="r in results" :key="r.item.permalink">
          <a
            :href="r.item.permalink"
            @click="showMobileSearch = false; query = ''; results = []"
            class="block px-4 py-3 border-b border-base-alt hover:bg-base-alt"
          >
            <div x-text="r.item.title" class="font-medium text-text"></div>
            <div x-text="r.item.description" class="text-xs text-grey truncate mt-0.5"></div>
          </a>
        </template>
      </div>
    </div>
  </div>
</nav>
